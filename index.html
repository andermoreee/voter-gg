<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>voter.gg</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#16183a;--mut:#6b7193;--line:#e7e9f3;--bg:#f5f6fb;--a:#4f7cff;--b:#8b5cff;--c:#ff6fb1;--g:#1fb88a;--r:24px;--e:cubic-bezier(.2,.8,.2,1);--sh:0 1px 2px rgba(22,24,58,.04),0 14px 34px -18px rgba(22,24,58,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(79,124,255,.45);outline-offset:2px}
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:float 18s ease-in-out infinite alternate}
.mesh i:nth-child(1){width:46vmax;height:46vmax;background:#bcd3ff;top:-16vmax;left:-10vmax}
.mesh i:nth-child(2){width:40vmax;height:40vmax;background:#e4d2ff;bottom:-14vmax;right:-8vmax;animation-duration:22s}
.mesh i:nth-child(3){width:30vmax;height:30vmax;background:#c9f5e6;top:35%;left:50%;animation-duration:26s}
@keyframes float{to{transform:translate(6vw,4vh) scale(1.08)}}
@keyframes sh{to{background-position:200% 0}}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
@keyframes swap{from{opacity:.25;transform:translateY(10px)}}
@keyframes shim{to{background-position:-300% 0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px max(18px,env(safe-area-inset-left)) 14px;background:rgba(245,246,251,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(22,24,58,.06)}
.logo{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1}
.logo span{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
.ev-logo{display:block;width:min(310px,48vw);height:auto;max-height:58px;object-fit:contain;object-position:left center;margin-top:5px}
.grow{flex:1}
.acct{position:relative}
.av-btn{border:0;padding:0;background:none;border-radius:50%;cursor:pointer;display:block;transition:transform .3s var(--e)}
.av-btn:hover{transform:scale(1.07)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#bcd3ff,#e4d2ff);font-weight:900;font-size:15px;box-shadow:0 0 0 2px #fff,0 6px 16px -6px rgba(22,24,58,.35)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:30px;height:30px;font-size:12px;box-shadow:none}
.av.xl{width:84px;height:84px;font-size:32px;margin:0 auto 12px}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:230px;padding:8px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 26px 50px -18px rgba(22,24,58,.35);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .25s,transform .35s var(--e)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font-size:16px}
.menu-head span{color:var(--mut);font-size:13px;font-weight:700}
.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:800;cursor:pointer;transition:background .2s,transform .25s var(--e)}
.mi:hover{background:#f1f3fb;transform:translateX(3px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer;background:var(--ink);color:#fff;transition:transform .2s var(--e),box-shadow .3s,opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(22,24,58,.55)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.grad{background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 10px 24px -12px var(--b)}
.btn.grad:hover{box-shadow:0 14px 30px -10px var(--b)}
.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.sm{padding:8px 16px;font-size:14px}

main{max-width:680px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(22,24,58,.05);transition:box-shadow .4s var(--e),transform .4s var(--e)}
.ask{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 14px;margin-bottom:22px;cursor:pointer}
.ask:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(22,24,58,.04),0 22px 44px -18px rgba(79,124,255,.35)}
.ask .av{box-shadow:none;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.ask-ph{flex:1;color:var(--mut);font-weight:700;font-size:16px;min-width:0}
.seg{position:relative;display:flex;gap:4px;padding:5px;margin:0 0 20px;background:rgba(22,24,58,.06);border-radius:999px;width:fit-content;max-width:100%}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 20px;border-radius:999px;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap;transition:color .35s var(--e)}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:#fff;box-shadow:0 4px 14px -6px rgba(22,24,58,.3);transition:transform .45s var(--e),width .45s var(--e)}
.swap{animation:swap .45s var(--e)}
.status{color:#c2416e;font-weight:700;text-align:center;padding:14px}
.skel{height:200px;border-radius:var(--r);background:linear-gradient(90deg,#fff 25%,#f1f3fb 50%,#fff 75%);background-size:300% 100%;animation:shim 1.4s linear infinite;margin-bottom:18px;box-shadow:var(--sh)}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.orb{font-size:60px;display:inline-block;animation:bob 3s ease-in-out infinite}
.empty h3{color:var(--ink);margin:12px 0 4px;font-size:21px;font-weight:900}

.poll{padding:22px;margin-bottom:18px}
.poll.enter{animation:enter .6s var(--e) both}
.ph-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.who{min-width:0;flex:1}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:13px;font-weight:700}
.q{margin:0 0 16px;font-size:clamp(20px,4.5vw,25px);line-height:1.22;font-weight:900;letter-spacing:-.01em;overflow-wrap:anywhere}
.img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin:0 0 14px;background:#eef1fa;animation:pop .5s var(--e)}
.player{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;margin-bottom:14px;border-radius:999px;background:#f4f6fc}
.play{flex:none;width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 18px -8px var(--b);transition:transform .2s var(--e)}
.play:hover{transform:scale(1.08)}
.play:active{transform:scale(.92)}
.track{position:relative;flex:1;height:6px;border-radius:9px;background:#dfe4f5;cursor:pointer;overflow:hidden}
.track .fill,.player .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s linear}
.time{font-size:13px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
audio{display:none}
.opts{display:grid;gap:10px}
.opt{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:15px 18px;border-radius:16px;border:1.5px solid var(--line);background:#fafbff;font-weight:800;font-size:16px;cursor:pointer;transition:transform .25s var(--e),border-color .3s,background .3s,box-shadow .3s}
.opt>*:not(.fill){position:relative}
.opt .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:linear-gradient(90deg,#e3ebff,#ece3ff);transition:width .9s var(--e)}
.opt:hover{transform:translateY(-2px);border-color:#c5d1f7;box-shadow:0 10px 22px -14px rgba(79,124,255,.6)}
.opt:active{transform:scale(.98)}
.t{min-width:0;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.pc{font-variant-numeric:tabular-nums;color:var(--mut);opacity:0;transition:opacity .4s}
.tick{width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font-size:12px;display:grid;place-items:center;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.voted .pc{opacity:1}
.opt.mine{border-color:var(--a);background:#f3f6ff}
.opt.mine .fill{background:linear-gradient(90deg,#cfdcff,#dccbff)}
.opt.mine .tick{transform:scale(1)}
.voted .opt{cursor:default}
.voted .opt:hover{transform:none;box-shadow:none;border-color:var(--line)}
.voted .opt.mine:hover{border-color:var(--a)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;color:var(--mut);font-size:14px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:#f1f3fb;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink);font-weight:800;transition:background .25s,color .25s,transform .2s var(--e)}
.chip:hover{background:#e6ebfb;transform:translateY(-1px)}
.chip[aria-expanded=true]{background:var(--ink);color:#fff}
.cm{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--e)}
.cm.open{grid-template-rows:1fr}
.cm>div{min-height:0;overflow:hidden}
.cm-in{padding-top:16px}
.cmt{display:flex;gap:10px;margin-bottom:12px;animation:enter .4s var(--e) both}
.bub{background:#f4f6fc;border-radius:18px;padding:9px 13px;min-width:0;overflow-wrap:anywhere;font-size:15px}
.bub b{display:block;font-size:13px}
.big-st{display:block;font-size:44px;line-height:1.1;margin-top:2px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.none{color:var(--mut);font-weight:700;margin:4px 0 12px}
.stks{display:flex;gap:2px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.stks::-webkit-scrollbar{display:none}
.stk{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:none;font-size:22px;cursor:pointer;transition:transform .2s var(--e),background .2s}
.stk:hover{transform:scale(1.2) rotate(-6deg);background:#f1f3fb}
.stk.on{background:#e4ebff;box-shadow:0 0 0 2px var(--a)}
.cin{display:flex;gap:8px;align-items:center}
.cin input{flex:1;border-radius:999px;padding:10px 16px}

input,textarea{width:100%;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;transition:border-color .25s,box-shadow .25s}
input::placeholder,textarea::placeholder{color:#9aa0bd}
input:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(79,124,255,.15)}
textarea{resize:vertical}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(22,24,58,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(440px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px;padding:26px;box-shadow:0 40px 90px -30px rgba(22,24,58,.45);transform:translateY(18px) scale(.97);transition:transform .45s var(--e)}
.modal.open .sheet{transform:none}
.sheet h2{margin:0 0 16px;font-size:24px;font-weight:900}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:#f1f3fb;cursor:pointer;font-size:18px;line-height:1;transition:transform .3s var(--e),background .2s}
.x:hover{transform:rotate(90deg);background:#e6ebfb}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.err{color:#d83f77;font-size:14px;font-weight:700;min-height:20px}
.hint{margin:-4px 0 0;color:var(--mut);font-size:13px;font-weight:700}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:16px;border:1.5px dashed #b9c6f2;background:#f7f9ff;font-weight:800;cursor:pointer;transition:background .25s,transform .25s,border-color .25s,color .25s;text-align:center}
.drop:hover{background:#eef3ff;transform:translateY(-2px);border-color:var(--a)}
.drop.ok{border-style:solid;border-color:var(--g);background:#ecfbf5;color:#117a58}
.toast{position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,180%);background:var(--ink);color:#fff;font-weight:800;padding:12px 20px;border-radius:999px;box-shadow:0 18px 40px -16px rgba(22,24,58,.6);transition:transform .55s cubic-bezier(.2,1.3,.4,1);max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media (max-width:520px){.logo{font-size:24px}.ev-logo{width:min(230px,48vw);max-height:48px}.top{gap:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <div>
    <div class="logo">voter<span>.gg</span></div>
    <img class="ev-logo" src="./everybody-votes-logo.png" alt="Everybody Votes Channel" />
  </div>
  <div class="grow"></div>
  <button class="btn sm" id="loginBtn">Log in</button>
  <div class="acct" id="acct" hidden>
    <button class="av-btn" id="avBtn" aria-label="Account menu" aria-haspopup="true"><span class="av" id="avIn"></span></button>
    <div class="menu" id="menu" role="menu">
      <div class="menu-head"><b id="mName"></b><span id="mUser"></span></div>
      <label class="mi">📷 Change picture<input type="file" id="pPic" accept="image/*" hidden></label>
      <button class="mi" id="logout">Log out</button>
    </div>
  </div>
</header>

<main>
  <div class="ask card" id="ask" role="button" tabindex="0">
    <span class="av" id="askAv">✦</span>
    <span class="ask-ph">What should everybody vote on?</span>
    <span class="btn grad sm">Ask</span>
  </div>

  <nav class="seg" id="tabs" aria-label="Sort polls"><i class="ind"></i><button class="on" data-v="hot">Trending</button><button data-v="new">Newest</button></nav>

  <p class="status" id="status" hidden></p>
  <div id="skel" hidden><div class="skel"></div><div class="skel"></div></div>
  <section id="feed"></section>
  <div class="empty" id="empty" hidden><span class="orb">🗳️</span><h3>No polls yet</h3><p>Be the first to ask everybody something.</p></div>
</main>

<div class="modal" id="authM"><div class="sheet">
  <button class="x" data-close aria-label="Close">×</button>
  <h2 id="aTitle">Welcome back</h2>
  <div class="seg" id="amode"><i class="ind"></i><button data-v="in" class="on">Log in</button><button data-v="up">Sign up</button></div>
  <div class="stack">
    <input id="aUser" placeholder="Username" maxlength="20" autocomplete="username" autocapitalize="none">
    <input id="aName" placeholder="Display name" maxlength="24" hidden>
    <input id="aPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <label class="drop" id="aPicL" hidden><input type="file" id="aPic" accept="image/*" hidden><span id="aPicT">📷 Add a profile picture (optional)</span></label>
    <div class="err" id="aErr"></div>
    <button class="btn grad" id="aGo">Log in</button>
  </div>
</div></div>

<div class="modal" id="newM"><div class="sheet">
  <button class="x" data-close aria-label="Close">×</button>
  <h2>Ask everybody</h2>
  <div class="stack">
    <textarea id="nQ" rows="2" maxlength="160" dir="auto" placeholder="What should the world vote on?"></textarea>
    <div class="stack" id="nOpts"></div>
    <button class="btn soft sm" id="nAdd" style="justify-self:start">+ Add option</button>
    <div class="row">
      <label class="drop" id="nImgL"><input type="file" id="nImg" accept="image/*" hidden><span>🖼️ Picture</span></label>
      <label class="drop" id="nAudL"><input type="file" id="nAud" accept="audio/*" hidden><span>🎵 Audio clip</span></label>
    </div>
    <p class="hint">Audio clips must be under 90 KB, about 10 seconds.</p>
    <div class="err" id="nErr"></div>
    <button class="btn grad" id="nGo" disabled>Post poll</button>
  </div>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okImg=u=>typeof u==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u)?u:'';
const okAud=u=>typeof u==='string'&&/^data:audio\/[\w.+-]+;base64,[A-Za-z0-9+/=]+$/.test(u)?u:'';
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ST=['🔥','👑','💀','🤡','🎉','😭','🫠','👀','💯','🐸','🦄','🛸','⚡','🍕','🎮','🤖','🌈','🧠','💅','🥶','🫶','👽','🚀','🏆'];
const S={db:null,me:null,polls:[],votes:{},comments:{},accounts:{},tab:'hot',cards:new Map(),loaded:false,booted:false,mode:'in',pic:'',nImg:'',nAud:''};
const enc=new TextEncoder();
const LS={get(){try{return localStorage.getItem('ev_user')||''}catch{return ''}},set(v){try{v?localStorage.setItem('ev_user',v):localStorage.removeItem('ev_user')}catch{}}};
const open=id=>$(id).classList.add('open');
const closeM=el=>el.classList.remove('open');
const status=t=>{const el=$('#status');el.textContent=t;el.hidden=!t};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const total=id=>Object.keys(S.votes[id]||{}).length;
const dur=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
async function hashPw(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toData(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');x.fillStyle='#e9edf9';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that image'))};im.src=url})}
const readData=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read that file'));r.readAsDataURL(file)});
function avatar(u){const a=S.accounts[u]||{},img=okImg(a.avatar);return img?`<img src="${esc(img)}" alt="">`:esc((a.name||u||'?')[0].toUpperCase())}
function setAv(el,u){const h=avatar(u);if(el.avk!==h){el.avk=h;el.innerHTML=h}}

// segmented control with a sliding indicator
function seg(root,fn){
  const ind=root.querySelector('.ind'),btns=[...root.querySelectorAll('button')];
  const place=()=>{const on=root.querySelector('button.on')||btns[0];ind.style.width=on.offsetWidth+'px';ind.style.transform='translateX('+on.offsetLeft+'px)'};
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('on'))return;btns.forEach(x=>x.classList.toggle('on',x===b));place();fn&&fn(b.dataset.v)});
  addEventListener('resize',place);
  return place;
}
const placeTabs=seg($('#tabs'),v=>{S.tab=v;const f=$('#feed');f.classList.remove('swap');void f.offsetWidth;f.classList.add('swap');renderFeed()});
const placeMode=seg($('#amode'),setMode);
document.fonts&&document.fonts.ready.then(()=>{placeTabs();placeMode()});
placeTabs();placeMode();

// ---- account ----
function renderMe(){
  const a=(S.me&&S.accounts[S.me.user])||{};
  $('#loginBtn').hidden=!!S.me;
  $('#acct').hidden=!S.me;
  if(S.me)setAv($('#askAv'),S.me.user);else{$('#askAv').innerHTML='✦';$('#askAv').avk=''}
  if(S.me){setAv($('#avIn'),S.me.user);$('#mName').textContent=a.name||S.me.user;$('#mUser').textContent='@'+S.me.user}
  else $('#menu').classList.remove('open');
}
function login(u){S.me={user:u};LS.set(u);renderMe();renderFeed()}
function setMode(m){
  S.mode=m;
  $$('#amode button').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  placeMode();
  const up=m==='up';
  $('#aName').hidden=!up;$('#aPicL').hidden=!up;
  $('#aGo').textContent=up?'Create account':'Log in';
  $('#aTitle').textContent=up?'Join voter.gg':'Welcome back';
  $('#aErr').textContent='';
}
function openAuth(m='in'){setMode(m);$('#aPass').value='';$('#aErr').textContent='';open('#authM');setTimeout(()=>$('#aUser').focus(),250)}
$('#loginBtn').onclick=()=>openAuth('in');
$('#aPic').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.pic=await toData(f,160,.82);$('#aPicL').classList.add('ok');$('#aPicT').textContent='✓ Picture ready'}catch(x){$('#aErr').textContent=x.message}};
async function auth(){
  const err=m=>$('#aErr').textContent=m,btn=$('#aGo');
  if(!S.db||!S.auth)return err('Firebase is not configured yet. Follow SETUP.md.');
  const u=$('#aUser').value.trim().toLowerCase(),p=$('#aPass').value;
  if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Username: 3–20 letters, numbers or _');
  if(p.length<6)return err('Password needs 6+ characters');
  btn.disabled=true;
  const email=u+'@voter.gg';
  try{
    const ref=S.db.doc('accounts/'+u),snap=await ref.get();
    if(S.mode==='up'){
      if(snap.exists)throw new Error('That username is taken');
      const name=$('#aName').value.trim()||u;
      const cred=await S.auth.createUserWithEmailAndPassword(email,p);
      await ref.set({user:u,name,avatar:S.pic,uid:cred.user.uid,made:Date.now()});
      S.accounts[u]={user:u,name,avatar:S.pic,uid:cred.user.uid};
      login(u);toast('Welcome, '+name+' 🎉');
    }else{
      if(!snap.exists)throw new Error('No account with that name');
      const a=snap.data();
      const cred=await S.auth.signInWithEmailAndPassword(email,p);
      if(a.uid!==cred.user.uid){await S.auth.signOut();throw new Error('Account verification failed.')}
      S.accounts[u]=a;login(u);toast('Welcome back, '+(a.name||u)+' ✨');
    }
    closeM($('#authM'));
  }catch(e){
    const code=e.code||'';
    if(code==='auth/email-already-in-use')err('That username is already taken');
    else if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')err('Incorrect username or password');
    else if(code==='auth/too-many-requests')err('Too many attempts. Try again later.');
    else err(e.message||'Something went wrong');
  }finally{btn.disabled=false}
}
$('#aGo').onclick=auth;
$('#aPass').addEventListener('keydown',e=>{if(e.key==='Enter')auth()});

const menu=$('#menu');
$('#avBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#acct'))menu.classList.remove('open')});
$('#logout').onclick=()=>{S.me=null;LS.set('');menu.classList.remove('open');renderMe();renderFeed();toast('Logged out')};
$('#pPic').onchange=async e=>{
  const f=e.target.files[0];menu.classList.remove('open');
  if(!f||!S.me)return;
  try{
    const avatarData=await toData(f,160,.82);
    await S.db.doc('accounts/'+S.me.user).update({avatar:avatarData});
    S.accounts[S.me.user]={...S.accounts[S.me.user],avatar:avatarData};
    renderMe();renderFeed();toast('Profile picture updated ✨')
  }
  catch(x){toast(x.message)}
  finally{e.target.value=''}
};
$$('[data-close]').forEach(b=>b.onclick=()=>closeM(b.closest('.modal')));
$$('.modal').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)closeM(m)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$$('.modal.open').forEach(closeM);menu.classList.remove('open')}});

// ---- composer ----
function addOpt(){const box=$('#nOpts');if(box.children.length>=4)return;const i=document.createElement('input');i.placeholder='Option '+(box.children.length+1);i.maxLength=40;i.dir='auto';i.setAttribute('aria-label','Option '+(box.children.length+1));box.appendChild(i)}
function checkPost(){const ok=$('#nQ').value.trim()&&$$('#nOpts input').filter(i=>i.value.trim()).length>=2;$('#nGo').disabled=!ok}
function openNew(){
  if(!S.me)return openAuth('in');
  $('#nQ').value='';$('#nOpts').innerHTML='';addOpt();addOpt();
  S.nImg=S.nAud='';
  $('#nImgL').classList.remove('ok');$('#nAudL').classList.remove('ok');
  $('#nImgL span').textContent='🖼️ Picture';$('#nAudL span').textContent='🎵 Audio clip';
  $('#nErr').textContent='';checkPost();open('#newM');setTimeout(()=>$('#nQ').focus(),250);
}
const ask=$('#ask');
ask.onclick=openNew;
ask.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNew()}};
$('#nAdd').onclick=addOpt;
$('#newM').addEventListener('input',checkPost);
$('#nImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.nImg=await toData(f,560,.7);$('#nImgL').classList.add('ok');$('#nImgL span').textContent='✓ Picture added';$('#nErr').textContent=''}catch(x){$('#nErr').textContent=x.message}};
$('#nAud').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(f.size>90000){$('#nErr').textContent='Audio must be under 90 KB.';e.target.value='';return}
  try{S.nAud=await readData(f);$('#nAudL').classList.add('ok');$('#nAudL span').textContent='✓ '+f.name.slice(0,16);$('#nErr').textContent=''}
  catch(x){$('#nErr').textContent=x.message}
};
$('#nGo').onclick=async()=>{
  const btn=$('#nGo'),q=$('#nQ').value.trim(),opts=$$('#nOpts input').map(i=>i.value.trim()).filter(Boolean).slice(0,4);
  btn.textContent='Posting…';btn.disabled=true;
  try{await S.db.collection('polls').add({q,opts,img:S.nImg,aud:S.nAud,by:S.me.user,at:Date.now()});closeM($('#newM'));toast('Poll posted 🚀')}
  catch(x){$('#nErr').textContent=x.message||'Could not post poll'}
  finally{btn.textContent='Post poll';checkPost()}
};

// ---- feed ----
function wirePlayer(a){
  const pl=a.parentElement,btn=pl.querySelector('.play'),fill=pl.querySelector('.fill'),tm=pl.querySelector('.time'),tr=pl.querySelector('.track');
  btn.onclick=()=>{if(a.paused)a.play().catch(()=>toast('Could not play this clip'));else a.pause()};
  a.onplay=()=>{btn.textContent='❚❚';document.querySelectorAll('audio').forEach(x=>{if(x!==a)x.pause()})};
  a.onpause=()=>{btn.textContent='▶'};
  a.onended=()=>{btn.textContent='▶';fill.style.width='0%';tm.textContent=dur(a.duration)};
  a.ontimeupdate=()=>{fill.style.width=(a.duration?a.currentTime/a.duration*100:0)+'%';tm.textContent=dur(a.currentTime)};
  a.onloadedmetadata=()=>{tm.textContent=dur(a.duration)};
  tr.onclick=e=>{if(!a.duration||!isFinite(a.duration))return;const r=tr.getBoundingClientRect();a.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*a.duration};
}
function mkCard(p){
  const el=document.createElement('article');
  el.className='card poll';el.dataset.id=p.id;el.dataset.st='';
  const img=okImg(p.img),aud=okAud(p.aud);
  el.innerHTML=
  `<div class="ph-head"><span class="av" data-av></span><div class="who"><b data-nm></b><small data-meta></small></div></div>
  <h2 class="q" dir="auto">${esc(p.q)}</h2>
  ${img?`<img class="img" src="${esc(img)}" alt="">`:''}
  ${aud?`<div class="player"><button class="play" aria-label="Play clip">▶</button><div class="track"><i class="fill"></i></div><span class="time">0:00</span><audio preload="metadata" src="${esc(aud)}"></audio></div>`:''}
  <div class="opts">${(p.opts||[]).map((o,i)=>`<button class="opt" data-i="${i}"><i class="fill"></i><span class="t" dir="auto">${esc(o)}</span><span class="rt"><span class="tick">✓</span><b class="pc"></b></span></button>`).join('')}</div>
  <div class="foot"><span data-tot></span><button class="chip" data-cm aria-expanded="false">💬 <span data-cc>0</span></button></div>
  <div class="cm"><div><div class="cm-in"><div data-list></div><div class="stks">${ST.map(s=>`<button class="stk" data-s="${s}" aria-label="Sticker ${s}">${s}</button>`).join('')}</div><div class="cin"><input data-ci dir="auto" maxlength="200" placeholder="Add a comment…" aria-label="Comment"><button class="btn grad sm" data-send>Send</button></div></div></div></div>`;
  const a=el.querySelector('audio');if(a)wirePlayer(a);
  return el;
}
function paintCard(id){
  const el=S.cards.get(id),p=S.polls.find(x=>x.id===id);if(!el||!p)return;
  const v=S.votes[id]||{},n=p.opts.map(()=>0);
  Object.values(v).forEach(o=>{if(n[o]!=null)n[o]++});
  const tot=n.reduce((a,b)=>a+b,0),mine=S.me?v[S.me.user]:undefined,show=mine!==undefined;
  const a=S.accounts[p.by]||{};
  setAv(el.querySelector('[data-av]'),p.by);
  el.querySelector('[data-nm]').textContent=a.name||p.by;
  el.querySelector('[data-meta]').textContent='@'+p.by+' · '+ago(p.at);
  el.classList.toggle('voted',show);
  el.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i,pct=tot?Math.round(n[i]/tot*100):0;
    b.querySelector('.fill').style.width=(show?pct:0)+'%';
    b.querySelector('.pc').textContent=show?pct+'%':'';
    b.classList.toggle('mine',mine===i);
  });
  el.querySelector('[data-tot]').textContent=tot+(tot===1?' vote':' votes');
  const cs=S.comments[id]||[];
  el.querySelector('[data-cc]').textContent=cs.length;
  const key=cs.map(c=>{const ca=S.accounts[c.u]||{};return c.id+'~'+(ca.name||'')+'~'+(ca.avatar||'').length}).join();
  if(el.ck!==key){
    el.ck=key;
    el.querySelector('[data-list]').innerHTML=cs.length?cs.map(c=>{const ca=S.accounts[c.u]||{};return `<div class="cmt"><span class="av sm">${avatar(c.u)}</span><div class="bub"><b>${esc(ca.name||c.u)}</b>${c.t?`<span dir="auto">${esc(c.t)}</span>`:''}${c.s?`<span class="big-st">${esc(c.s)}</span>`:''}</div></div>`}).join(''):'<p class="none">No comments yet. Be the first ✦</p>';
  }
}
function renderFeed(){
  const feed=$('#feed');
  const list=[...S.polls].sort(S.tab==='hot'?(a,b)=>total(b.id)-total(a.id)||b.at-a.at:(a,b)=>b.at-a.at);
  const ids=new Set(list.map(p=>p.id));
  for(const[id,el] of S.cards)if(!ids.has(id)){el.remove();S.cards.delete(id)}
  list.forEach((p,i)=>{
    let el=S.cards.get(p.id);
    if(!el){
      el=mkCard(p);el.classList.add('enter');
      el.addEventListener('animationend',()=>el.classList.remove('enter'),{once:true});
      S.cards.set(p.id,el);
    }
    if(feed.children[i]!==el)feed.insertBefore(el,feed.children[i]||null);
    paintCard(p.id);
  });
  $('#skel').hidden=S.loaded||!S.db;
  $('#empty').hidden=!(S.loaded&&!list.length);
}
async function vote(id,i){
  if(!S.me)return openAuth('in');
  const v=S.votes[id]=S.votes[id]||{};
  if(v[S.me.user]===i)return;
  v[S.me.user]=i;paintCard(id);
  try{await S.db.doc('votes/'+id+'_'+S.me.user).set({p:id,u:S.me.user,o:i,at:Date.now()})}
  catch(e){toast('Vote failed: '+(e.message||'try again'))}
}
async function sendComment(card){
  if(!S.me)return openAuth('in');
  const inp=card.querySelector('[data-ci]'),t=inp.value.trim(),s=card.dataset.st;
  if(!t&&!s)return toast('Type something or pick a sticker');
  inp.value='';
  try{
    await S.db.collection('comments').add({p:card.dataset.id,u:S.me.user,t,s,at:Date.now()});
    card.dataset.st='';card.querySelectorAll('.stk').forEach(b=>b.classList.remove('on'));
  }catch(e){inp.value=t;toast('Could not send: '+(e.message||'try again'))}
}
$('#feed').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const opt=e.target.closest('.opt');if(opt)return vote(card.dataset.id,+opt.dataset.i);
  const chip=e.target.closest('[data-cm]');
  if(chip){
    const cm=card.querySelector('.cm'),isOpen=cm.classList.toggle('open');
    chip.setAttribute('aria-expanded',isOpen);
    if(isOpen)setTimeout(()=>card.querySelector('[data-ci]').focus({preventScroll:true}),400);
    return;
  }
  const st=e.target.closest('.stk');
  if(st){card.dataset.st=card.dataset.st===st.dataset.s?'':st.dataset.s;card.querySelectorAll('.stk').forEach(b=>b.classList.toggle('on',b.dataset.s===card.dataset.st));return}
  if(e.target.closest('[data-send]'))sendComment(card);
});
$('#feed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-ci]'))sendComment(e.target.closest('.card'))});

// ---- shared data (artifact db capability) ----
function start(){
  const db=S.db;
  db.collection('accounts').limit(500).onSnapshot(s=>{
    S.accounts={};s.docs.forEach(d=>{S.accounts[d.id]=d.data()});
    S.booted=true;
    renderMe();renderFeed();
  },e=>status(e.message));
  db.collection('polls').orderBy('at','desc').limit(100).onSnapshot(s=>{
    S.polls=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;renderFeed();
  },e=>status(e.message));
  db.collection('votes').limit(3000).onSnapshot(s=>{
    S.votes={};s.docs.forEach(d=>{const v=d.data();(S.votes[v.p]=S.votes[v.p]||{})[v.u]=v.o});
    S.polls.forEach(p=>paintCard(p.id));
  },()=>{});
  db.collection('comments').orderBy('at','asc').limit(1000).onSnapshot(s=>{
    S.comments={};s.docs.forEach(d=>{const c={id:d.id,...d.data()};(S.comments[c.p]=S.comments[c.p]||[]).push(c)});
    S.polls.forEach(p=>paintCard(p.id));
  },()=>{});
}
